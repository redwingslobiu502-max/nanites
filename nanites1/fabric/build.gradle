evaluationDependsOn(':core')
evaluationDependsOn(':shared-game')
sourceSets.main.resources.srcDir '../game-resources/common'
jar { archiveBaseName = 'nanites-fabric-1.21.1'; from project(':core').sourceSets.main.output; from project(':shared-game').sourceSets.main.output }
remapJar { archiveBaseName = 'nanites-fabric-1.21.1' }
